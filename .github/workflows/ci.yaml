name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 同一ブランチで新しい push があれば古い実行はキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # テストは workerd 上で実行される（@cloudflare/vitest-pool-workers）。
      # 外部通信はモックしているため、Supabase / R2 のシークレットは不要。
      - name: Test
        run: npm test
